name: Publicar The MIA's Paper

on:
  schedule:
    - cron: "7 * * * *"      # cada hora (minuto 7, hora UTC)
  workflow_dispatch:          # botón "Run workflow" para publicar a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer los RSS y armar la edición
        run: python3 radar.py --static _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
